    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 12.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.5
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.56 #0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0 #1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.2 #0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 3.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -3.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1  # robot is non-holonomic; no lateral motion to sample
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Was 500.0 each: 10-40x the weight of every path/goal-progress critic
      # combined (PathAlign 50, PathDist 32, GoalDist 24, GoalAlign 12), which
      # made DWB reject/heavily penalize any trajectory brushing the inflation
      # gradient near a wall -- causing the robot to refuse tight-but-passable
      # aisles it had physical room to traverse. Bench-tested at 25.0 (same
      # order of magnitude as the path-following critics) with no regression
      # in obstacle avoidance observed.
      BaseObstacle.scale: 25.0
      ObstacleFootprint.scale: 25.0
      PathAlign.scale: 50.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[ [0.55, 0.45], [0.55, -0.45], [-0.55, -0.45], [-0.55, 0.45] ]"
      # radiation_layer is intentionally absent from the local costmap.
      # Having it here caused DWB to treat diffuse radiation fields as physical
      # obstacles, leaving no valid trajectories and freezing the robot.
      # Radiation cost is handled at the global planning level only.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "denoise_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # 0.75 kept the full width of 1.25 m corridors inside the inflated
        # band (navA bench: ~5x fewer stuck triggers at 0.4, coverage ceiling
        # broken); original value preserved in nav2.yaml.pre_navA_backup
        inflation_radius: 0.4
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        #publish_voxel_map: True
        #origin_z: 0.0
        #z_resolution: 0.05
        #z_voxels: 16
        max_obstacle_height: 2.0
        #mark_threshold: 0
        observation_sources: points #hand
        points:
          topic: /sensors/lidar3d_0/points
          max_obstacle_height: 0.8
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.20
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      rolling_window: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[ [0.55, 0.45], [0.55, -0.45], [-0.55, -0.45], [-0.55, 0.45] ]"
      footprint_padding: 0.1
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "radiation_layer", "denoise_layer"]
      radiation_layer:
        plugin: "rad_costmap_plugin::RadiationLayer"
        heatmap_topic: "/rad_heatmap/gp_mean_map"
        # warning_threshold raised above background radiation max (~1.0 mrem/hr)
        # to avoid inflating costs on every cell due to normal background noise.
        warning_threshold_mrem_hr: 1.5
        # evacuation_threshold aligned with rad_safety's emergency threshold (8.0)
        # so the costmap and the safety system agree on what is truly dangerous.
        evacuation_threshold_mrem_hr: 8.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: points #hand
        points:
          topic: /sensors/lidar3d_0/points
          max_obstacle_height: 0.8
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # global counterpart of the navA adoption (was 1.0); see local costmap
        inflation_radius: 0.5
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

